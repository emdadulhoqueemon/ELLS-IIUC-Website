<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Membership Verification — ELLS IIUC</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { alabaster: '#FAF9F6', ink: '#111827', emeraldDeep: '#065F46', emeraldLight: '#ECFDF5', terracotta: '#D97706' },
          fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-alabaster text-ink font-sans antialiased">

  <header class="sticky top-0 z-40 bg-alabaster/90 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="./index.html" class="font-serif font-bold text-xl text-ink">ELLS <span class="text-emeraldDeep">IIUC</span></a>
      <nav class="flex items-center gap-6 text-sm font-semibold">
        <a href="./index.html" class="hover:text-emeraldDeep">Home</a>
        <a href="./events.html" class="hover:text-emeraldDeep">Events</a>
        <a href="./membership.html" class="text-emeraldDeep">Membership</a>
        <a href="./about.html" class="hover:text-emeraldDeep">Guilds</a>
      </nav>
    </div>
  </header>

  <main id="membershipStatusCheck" class="max-w-3xl mx-auto px-4 sm:px-6 py-12">
    <div class="bg-white border border-gray-200 rounded-3xl p-8 sm:p-10 shadow-sm">
      <span class="inline-block px-3 py-1 rounded-full bg-emeraldLight text-emeraldDeep text-xs font-bold mb-3">
        Live Google Sheets Registry
      </span>
      <h1 class="font-serif text-3xl sm:text-4xl font-bold mb-2">Verify ELLS Membership</h1>
      <p class="text-sm text-gray-600 mb-6">
        Enter your official IIUC Student ID to verify your active membership record in the English Language and Literary Society database.
      </p>

      <form id="memberVerifyForm" class="flex flex-col sm:flex-row gap-3">
        <input id="studentIdInput" type="text" placeholder="Enter Student ID (e.g. E241038)" required
          class="flex-1 px-4 py-3.5 rounded-xl border border-gray-300 text-sm font-medium focus:outline-none focus:border-emeraldDeep" />
        <button id="verifySubmitBtn" type="submit"
          class="px-6 py-3.5 rounded-xl bg-emeraldDeep text-white text-sm font-bold hover:bg-emerald-900 transition">
          Verify Status
        </button>
      </form>

      <div id="verifyResultBox" class="hidden"></div>
    </div>
  </main>

  <script type="module" src="./js/app-public.js"></script>
</body>
</html>
