<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT Secretary Console — ELLS IIUC</title>
  <link rel="manifest" href="./admin-manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { alabaster: '#FAF9F6', ink: '#111827', emeraldDeep: '#065F46', emeraldLight: '#ECFDF5', terracotta: '#D97706' },
          fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-alabaster text-ink font-sans antialiased min-h-screen">

  <!-- 1. SECURE LOGIN SCREEN -->
  <section id="adminLoginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white border border-gray-200 rounded-3xl p-8 sm:p-10 max-w-md w-full shadow-sm">
      <span class="px-3 py-1 rounded-full bg-emeraldLight text-emeraldDeep text-xs font-bold">Authorized Access Only</span>
      <h1 class="font-serif text-3xl font-bold mt-3 mb-1">ELLS Admin Console</h1>
      <p class="text-xs text-gray-500 mb-6">Sign in with your authorized ELLS IIUC administrator email.</p>

      <form id="adminLoginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1">Admin Email</label>
          <input type="email" name="email" required placeholder="emdadulhoquex@gmail.com"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-emeraldDeep" />
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Password</label>
          <input type="password" name="password" required placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-emeraldDeep" />
        </div>
        <button type="submit" class="w-full py-3.5 rounded-xl bg-emeraldDeep text-white text-sm font-bold hover:bg-emerald-900 transition">
          Access Console
        </button>
      </form>
      <p id="adminLoginError" class="hidden mt-4 text-xs text-red-600 font-semibold"></p>
      <a href="./index.html" class="block text-center text-xs text-gray-500 hover:text-ink mt-6">← Return to Public Portal</a>
    </div>
  </section>

  <!-- 2. AUTHENTICATED ADMIN DASHBOARD -->
  <section id="adminDashboardSection" class="hidden">
    <header class="bg-ink text-white py-4 px-4 sm:px-6 sticky top-0 z-40">
      <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <span class="font-serif font-bold text-lg">ELLS Secretariat Console</span>
          <span id="adminEmailBadge" class="hidden sm:inline-block px-2.5 py-0.5 rounded-full bg-white/10 text-[11px] text-emerald-300"></span>
        </div>
        <div class="flex items-center gap-3">
          <a href="./index.html" target="_blank" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-semibold">View Live Site ↗</a>
          <button id="adminLogoutBtn" type="button" class="px-3.5 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-xs font-semibold">Sign Out</button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Left Column: Publish Notice + Live Notices -->
      <div class="lg:col-span-5 space-y-6">
        <div class="bg-white border border-gray-200 rounded-3xl p-6 shadow-sm">
          <h2 class="font-serif text-2xl font-bold mb-4">Publish Notice</h2>
          <form id="publishNoticeForm" class="space-y-3">
            <input type="text" name="title" placeholder="Notice Title (e.g. Autumn-2026 General Meeting)" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs" />
            <input type="date" name="date" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs" />
            <textarea name="description" rows="3" placeholder="Notice details..." required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs"></textarea>
            <button type="submit" class="w-full py-3 rounded-xl bg-ink text-white text-xs font-bold hover:bg-emeraldDeep transition">
              Publish Notice
            </button>
          </form>
        </div>

        <div class="bg-white border border-gray-200 rounded-3xl p-6 shadow-sm">
          <h3 class="font-serif text-lg font-bold mb-3">Active Notices</h3>
          <div id="adminNoticesList" class="space-y-2.5 max-h-80 overflow-y-auto"></div>
        </div>
      </div>

      <!-- Right Column: Publish Event + ImgBB Uploader + Live Events -->
      <div class="lg:col-span-7 space-y-6">
        <div class="bg-white border border-gray-200 rounded-3xl p-6 shadow-sm">
          <h2 class="font-serif text-2xl font-bold mb-4">Publish Event</h2>
          <form id="publishEventForm" class="space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <input type="text" name="title" placeholder="Event Title" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs" />
              <select name="category" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs bg-white">
                <option value="Literary">Literary</option>
                <option value="Debate">Debate</option>
                <option value="Workshops">Workshops</option>
                <option value="Conference">Conference</option>
                <option value="Cultural & Tour">Cultural & Tour</option>
                <option value="Sports">Sports</option>
                <option value="Organizing">Organizing</option>
              </select>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <input type="text" name="date" placeholder="Date (e.g. Wed, Nov 25)" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs" />
              <input type="text" name="time" placeholder="Time (e.g. 2:00 PM)" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs" />
              <input type="text" name="venue" placeholder="Venue (e.g. Campus Hall)" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs" />
            </div>
            <input type="url" name="registrationLink" placeholder="Google Form Registration Link (Optional)" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs" />
            
            <!-- Direct ImgBB Poster Upload -->
            <div class="p-4 rounded-2xl bg-alabaster border border-dashed border-gray-300">
              <label class="block text-xs font-bold mb-1">Upload Poster to ImgBB (JPG/PNG, Max 8MB)</label>
              <input id="posterFileInput" type="file" accept="image/jpeg,image/jpg,image/png" class="text-xs" />
              <p id="posterUploadStatus"></p>
              <input id="posterUrlInput" type="url" name="posterUrl" placeholder="Or paste direct poster HTTPS URL..." class="mt-2 w-full px-3 py-2 rounded-xl border border-gray-300 text-xs bg-white" />
            </div>

            <textarea name="description" rows="3" placeholder="Event summary..." required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs"></textarea>
            <button type="submit" class="w-full py-3 rounded-xl bg-emeraldDeep text-white text-xs font-bold hover:bg-emerald-900 transition">
              Publish Event
            </button>
          </form>
        </div>

        <div class="bg-white border border-gray-200 rounded-3xl p-6 shadow-sm">
          <h3 class="font-serif text-lg font-bold mb-3">Published Events</h3>
          <div id="adminEventsList" class="space-y-2.5 max-h-80 overflow-y-auto"></div>
        </div>
      </div>

    </main>
  </section>

  <div id="adminToast" class="hidden"></div>
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
