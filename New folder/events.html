<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events & RSVP — ELLS IIUC</title>
  <link rel="manifest" href="./manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { alabaster: '#FAF9F6', ink: '#111827', emeraldDeep: '#065F46', emeraldLight: '#ECFDF5', terracotta: '#D97706' },
          fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-alabaster text-ink font-sans antialiased">

  <header class="sticky top-0 z-40 bg-alabaster/90 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="./index.html" class="font-serif font-bold text-xl text-ink">ELLS <span class="text-emeraldDeep">IIUC</span></a>
      <nav class="flex items-center gap-6 text-sm font-semibold">
        <a href="./index.html" class="hover:text-emeraldDeep">Home</a>
        <a href="./events.html" class="text-emeraldDeep">Events</a>
        <a href="./membership.html" class="hover:text-emeraldDeep">Membership</a>
        <a href="./about.html" class="hover:text-emeraldDeep">Guilds</a>
        <a href="./admin.html" class="px-3.5 py-1.5 rounded-lg bg-ink text-white text-xs">Admin</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-10 space-y-8">
    <div class="bg-white border border-gray-200 rounded-3xl p-8 shadow-sm">
      <span class="text-xs font-bold uppercase tracking-wider text-emeraldDeep">Departmental Activities</span>
      <h1 class="font-serif text-4xl font-bold mt-1 mb-4">Events, Workshops & Salons</h1>
      
      <!-- Search & Category Filter Bar -->
      <div class="flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center mt-6">
        <div class="flex flex-wrap gap-2">
          <button data-event-category="ALL" class="px-3.5 py-1.5 rounded-full text-xs font-semibold border border-emeraldDeep bg-emeraldDeep text-white transition">All Events</button>
          <button data-event-category="Literary" class="px-3.5 py-1.5 rounded-full text-xs font-semibold border border-gray-300 bg-white text-gray-700 hover:border-ink transition">Literary</button>
          <button data-event-category="Debate" class="px-3.5 py-1.5 rounded-full text-xs font-semibold border border-gray-300 bg-white text-gray-700 hover:border-ink transition">Debate</button>
          <button data-event-category="Workshops" class="px-3.5 py-1.5 rounded-full text-xs font-semibold border border-gray-300 bg-white text-gray-700 hover:border-ink transition">Workshops</button>
          <button data-event-category="Conference" class="px-3.5 py-1.5 rounded-full text-xs font-semibold border border-gray-300 bg-white text-gray-700 hover:border-ink transition">Conference</button>
          <button data-event-category="Cultural & Tour" class="px-3.5 py-1.5 rounded-full text-xs font-semibold border border-gray-300 bg-white text-gray-700 hover:border-ink transition">Cultural & Tour</button>
          <button data-event-category="Sports" class="px-3.5 py-1.5 rounded-full text-xs font-semibold border border-gray-300 bg-white text-gray-700 hover:border-ink transition">Sports</button>
        </div>

        <input id="eventSearchInput" type="search" placeholder="Search event title or venue..."
          class="px-4 py-2 rounded-xl border border-gray-300 text-xs w-full md:w-64 focus:outline-none focus:border-emeraldDeep" />
      </div>
    </div>

    <div id="eventsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Live Firestore Events Render Here -->
    </div>
  </main>

  <!-- HTML5 Dialog RSVP Modal -->
  <dialog id="rsvpModal" class="rounded-3xl p-0 max-w-md w-full border border-gray-200 shadow-2xl backdrop:bg-black/50">
    <div class="p-7 bg-white">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-bold uppercase text-emeraldDeep">Guest Seat Reservation</span>
        <button type="button" data-close-rsvp class="text-gray-400 hover:text-ink text-lg font-bold">✕</button>
      </div>
      <h3 id="rsvpEventTitle" class="font-serif text-2xl font-bold mb-4">Event RSVP</h3>
      <form id="rsvpForm" class="space-y-3">
        <input type="text" name="guestName" placeholder="Your Full Name" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs" />
        <input type="email" name="guestEmail" placeholder="IIUC or Personal Email" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs" />
        <input type="text" name="studentId" placeholder="Student ID (e.g., E241038)" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-xs" />
        <button type="submit" class="w-full py-3 rounded-xl bg-emeraldDeep text-white text-xs font-bold hover:bg-emerald-900 transition">
          Confirm Seat Reservation
        </button>
      </form>
      <p id="rsvpFeedback" class="hidden mt-4 p-3 rounded-xl bg-emeraldLight text-emeraldDeep text-xs font-semibold"></p>
    </div>
  </dialog>

  <script type="module" src="./js/app-public.js"></script>
</body>
</html>
